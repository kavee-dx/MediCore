apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: medicore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
      - name: doctor-service
        image: medicore-doctor-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "ep-lingering-glitter-a1r112o9-pooler.ap-southeast-1.aws.neon.tech"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "medicore_doctor"
        - name: DB_USER
          value: "neondb_owner"
        - name: DB_PASSWORD
          value: "npg_ZnWA9KSEqO7c"
        - name: DB_SSL
          value: "true"
        - name: PATIENT_DATABASE_URL
          value: "postgresql://neondb_owner:npg_ZnWA9KSEqO7c@ep-lingering-glitter-a1r112o9-pooler.ap-southeast-1.aws.neon.tech/patient_db?sslmode=require"
        - name: APPOINTMENT_DATABASE_URL
          value: "postgresql://neondb_owner:npg_ZnWA9KSEqO7c@ep-lingering-glitter-a1r112o9-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require"
        - name: JWT_SECRET
          value: "e31203d467d0efc34b3d9c248e3c2a2e4a8345d6fee4a78a3cef8594d0a4551e94355d79da2ed4bf9021faa881a4213df017f243e5d3009518d2d6038f72df30"
        - name: NODE_ENV
          value: "production"
        - name: TZ
          value: "Asia/Colombo"
        - name: JITSI_DOMAIN
          value: "meet.jit.si"
        - name: CLOUDINARY_CLOUD_NAME
          value: "dvi8gecj0"
        - name: CLOUDINARY_API_KEY
          value: "665316383884714"
        - name: CLOUDINARY_API_SECRET
          value: "ePT8Gpv5Kdl_ocB5kS19X_vPz_s"
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: medicore
spec:
  selector:
    app: doctor-service
  ports:
  - port: 3000
    targetPort: 3000
